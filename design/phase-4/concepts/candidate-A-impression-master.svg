<!-- KHATIM — Candidate A "The Impression" — DEVELOPMENT CANDIDATE / NOT FINAL -->
<!-- Bounded octagonal substrate (matrix) with a centered rhombic impression (counter) -->
<!-- and a single perceivable calligraphic nuqta diamond at the optical center. -->
<!-- Module: u = 16 (base unit). Canonical bbox: 8u x 8u. All vertices on the 45° nuqta lattice. -->
<!-- Single silhouette, counter-driven, expanded fill. Reverses with zero edits. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t d">
  <title id="t">Khatim — The Impression (master candidate A)</title>
  <desc id="d">A chamfered octagon (the matrix) on the 45-degree rhombic nuqta lattice, with a centered rhombic counter (the impression) and a single calligraphic nuqta diamond at the optical center (the attestation).</desc>
  <!-- substrate octagon + impression counter, single evenodd path -->
  <path fill="currentColor" fill-rule="evenodd"
        d="M160 64 L192 96 L192 160 L160 192 L96 192 L64 160 L64 96 L96 64 Z
           M128 96 L160 128 L128 160 L96 128 Z"/>
  <!-- perceivable calligraphic nuqta at the center of the impression -->
  <path fill="currentColor" d="M128 120 L136 128 L128 136 L120 128 Z"/>
</svg>
