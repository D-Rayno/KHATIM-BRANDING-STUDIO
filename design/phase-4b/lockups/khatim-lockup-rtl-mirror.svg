<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img">
  <title>KHATIM RTL mirror lockup</title>
  <!-- Phase 4B development — NOT final. TYPE PLACEHOLDER (DO-NOT-SHIP).
       The full bilingual lockup mirrored for RTL markets: mark flips to the
       right side, reading direction reverses. Demonstrates the mirror rule. -->
  <g>
    <!-- mirrored mark (flip x so the notch flips to the opposite visual corner) -->
    <g transform="translate(560,76) scale(0.5,0.5) scale(-1,1) translate(-256,0)">
      <g fill="currentColor" fill-rule="evenodd">
        <path d="M64 64 H192 V192 H64 Z M160 160 H192 V192 H160 Z M168 160 L176 168 L168 176 L160 168 Z" />
      </g>
    </g>
    <text x="500" y="104" font-family="sans-serif" font-size="64" fill="currentColor" text-anchor="end">KHATIM</text>
    <text x="120" y="150" font-family="monospace" font-size="12" fill="currentColor">PLACEHOLDER TYPE — DO NOT SHIP (RTL mirror; mark flipped to the Arabic-initial side)</text>
  </g>
</svg>
