<!-- EXPLORATION STUDY — NOT FINAL -->
<!-- CS-1: refined void-core (F-05) rebuilt on the 45° rhombic nuqta lattice. u=16, pitch 2u=32. -->
<!-- Octagon bbox 8u x 8u, chamfer 2u @ 45°, counter rhombus 4u x 4u. Every vertex = lattice node. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
  <defs>
    <!-- 45° rhombic lattice: two diagonal families, tile 2u x 2u, seamless at tile corners -->
    <pattern id="lattice" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M0,0 L32,32 M32,0 L0,32" fill="none" stroke="#111111" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <!-- core mark, centered at origin: solid octagon + evenodd rhombus counter (single path) -->
    <path id="mark" fill="#111111" fill-rule="evenodd"
      d="M64,32 L32,64 L-32,64 L-64,32 L-64,-32 L-32,-64 L32,-64 L64,-32 Z
         M0,-32 L32,0 L0,32 L-32,0 Z"/>
  </defs>

  <!-- sheet label -->
  <text x="320" y="34" font-family="monospace" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">CONSTRUCTION STUDY — EXPLORATION</text>
  <text x="320" y="54" font-family="monospace" font-size="11" fill="#111111" text-anchor="middle">CS-1 · refined void-core on 45° rhombic nuqta lattice · u = 16 · pitch 2u · s = u/2</text>

  <!-- lattice field behind construction -->
  <rect x="64" y="80" width="384" height="384" fill="url(#lattice)"/>
  <rect x="64" y="80" width="384" height="384" fill="none" stroke="#111111" stroke-opacity="0.4" stroke-width="1"/>

  <!-- construction centerlines (annotation) -->
  <g stroke="#111111" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="6 4">
    <line x1="64" y1="320" x2="448" y2="320"/>
    <line x1="256" y1="80" x2="256" y2="464"/>
  </g>

  <!-- the mark, placed so its center sits on lattice node (256,320) -->
  <use href="#mark" transform="translate(256,320)"/>

  <!-- dimension: overall width 8u -->
  <g stroke="#111111" stroke-width="1">
    <line x1="192" y1="412" x2="192" y2="428"/>
    <line x1="320" y1="412" x2="320" y2="428"/>
    <line x1="192" y1="420" x2="320" y2="420"/>
  </g>
  <text x="256" y="440" font-family="monospace" font-size="11" fill="#111111" text-anchor="middle">8u (bbox)</text>
  <text x="256" y="480" font-family="monospace" font-size="10" fill="#111111" text-anchor="middle">counter 4u × 4u · walls ≥ 2u · all vertices on lattice nodes</text>

  <!-- leader + labels -->
  <g stroke="#111111" stroke-width="1" fill="none">
    <polyline points="288,256 350,210 400,210"/>
    <polyline points="272,320 350,290 400,290"/>
  </g>
  <text x="404" y="214" font-family="monospace" font-size="11" fill="#111111">chamfer 2u @ 45°</text>
  <text x="404" y="294" font-family="monospace" font-size="11" fill="#111111">void = impression</text>

  <!-- module detail: nuqta rhombus, shown 2x -->
  <polygon points="552,128 568,144 552,160 536,144" fill="none" stroke="#111111" stroke-width="1.5"/>
  <g stroke="#111111" stroke-width="0.75" stroke-dasharray="3 3">
    <line x1="536" y1="144" x2="568" y2="144"/>
    <line x1="552" y1="128" x2="552" y2="160"/>
  </g>
  <text x="552" y="180" font-family="monospace" font-size="10" fill="#111111" text-anchor="middle">nuqta module u × u (2×)</text>

  <!-- stroke + gap specimens -->
  <rect x="520" y="196" width="64" height="8" fill="#111111"/>
  <text x="552" y="220" font-family="monospace" font-size="10" fill="#111111" text-anchor="middle">stroke s = u/2</text>
  <rect x="520" y="240" width="24" height="24" fill="#111111"/>
  <rect x="560" y="240" width="24" height="24" fill="#111111"/>
  <text x="552" y="282" font-family="monospace" font-size="10" fill="#111111" text-anchor="middle">min gap ≥ u</text>

  <!-- scale strip: 64 / 32 / 16 px renderings -->
  <line x1="64" y1="508" x2="576" y2="508" stroke="#111111" stroke-width="1"/>
  <text x="64" y="530" font-family="monospace" font-size="11" fill="#111111">scale test</text>
  <use href="#mark" transform="translate(180,568) scale(0.5)"/>
  <use href="#mark" transform="translate(292,568) scale(0.25)"/>
  <use href="#mark" transform="translate(380,568) scale(0.125)"/>
  <text x="180" y="612" font-family="monospace" font-size="10" fill="#111111" text-anchor="middle">64px</text>
  <text x="292" y="612" font-family="monospace" font-size="10" fill="#111111" text-anchor="middle">32px</text>
  <text x="380" y="612" font-family="monospace" font-size="10" fill="#111111" text-anchor="middle">16px</text>
  <text x="460" y="556" font-family="monospace" font-size="10" fill="#111111">16px: hole = 8px ✓</text>
  <text x="460" y="572" font-family="monospace" font-size="10" fill="#111111">walls = 4px ✓</text>
  <text x="460" y="588" font-family="monospace" font-size="10" fill="#111111">monochrome ✓ reverse ✓</text>
</svg>
